<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Reset password · Vivid Life Portal</title><style>body{margin:0;background:#f3f6fb;color:#173052;font:16px system-ui;display:grid;min-height:100vh;place-items:center}main{box-sizing:border-box;width:min(440px,94vw);background:white;padding:32px;border-radius:18px;box-shadow:0 12px 45px #17305212}h1{font-size:26px}p{line-height:1.5;color:#53657d}form{display:grid;gap:16px}label{display:grid;gap:7px}input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:8px;border:1px solid #ccd7e6;font:inherit}button{background:#0965ee;color:white;border:0;cursor:pointer}button:disabled{opacity:.6}a{color:#0965ee}#status{margin:16px 0;overflow-wrap:anywhere}[hidden]{display:none!important}</style><script>window.recoveryFragment=location.hash;history.replaceState(null,'',location.pathname);</script><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><script defer src="/password-reset.js?v=20261027"></script></head><body><main><strong>VIVID LIFE PORTAL</strong><h1 id="heading">Forgot password?</h1><p id="intro">Enter your account email and we’ll send you a password reset link.</p><div id="status" role="status" aria-live="polite"></div><form id="request"><label>Email<input name="email" type="email" autocomplete="username" required maxlength="254"></label><button>Send reset link</button></form><form id="verify" hidden><label>Authenticator code<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label><button>Verify code</button></form><form id="change" hidden><label>New password<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><label>Confirm new password<input name="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><button>Save new password</button></form><p><a href="/">Back to sign in</a></p></main></body></html>
