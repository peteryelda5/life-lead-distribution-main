function storedSession(){try{return JSON.parse(localStorage.getItem('lld_session')||'null')}catch{localStorage.removeItem('lld_session');return null}}
const S={session:storedSession(),profile:null,agents:[],leads:[],poolLeads:[],assignedLeads:[],closed:[],audit:[],stats:{total_leads:0,unassigned:0,assigned:0,closed:0,monthly_premium:0,annual_premium:0},agentStats:{},leadFilterCounts:[],myClosedStats:{count:0,monthly_premium:0,annual_premium:0},tab:'dashboard',selected:new Set(),msg:'',err:'',filter:'',leadTypeFilter:'',stateFilter:'',pageSize:100,poolPage:1,assignedPage:1,closedPage:1,myPage:1,myClosedPage:1,poolCount:0,assignedCount:0,closedCount:0,myCount:0,myClosedCount:0,mfaMode:null,mfaFactor:null,mfaEnroll:null};

const app=document.getElementById('app'),q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)],esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(v||0));

async function verifyMfaCode(code,enrolling=false){code=String(code||'').replace(/\s+/g,'');if(!/^\d{6}$/.test(code))throw new Error('Enter the 6-digit verification code.');await syncSbSession();const factorId=(enrolling?S.mfaEnroll?.id:S.mfaFactor?.id);if(!factorId)throw new Error('Verification setup could not be found. Please sign in again.');const challenge=await SB.auth.mfa.challenge({factorId});if(challenge.error)throw challenge.error;const verified=await SB.auth.mfa.verify({factorId,challengeId:challenge.data.id,code});if(verified.error)throw verified.error;await adoptSbSession(verified.data);S.mfaMode=null;S.mfaEnroll=null;S.mfaFactor=null;await loadCore();render()}
function tokenExpiry(){let exp=Number(S.session?.expires_at||0);if(exp)return exp;try{let part=String(S.session?.access_token||'').split('.')[1].replace(/-/g,'+').replace(/_/g,'/');part+='='.repeat((4-part.length%4)%4);const payload=JSON.parse(atob(part));return Number(payload.exp||0)}catch{return 0}}

async function raw(path,opt={}){let h={'apikey':KEY,'Content-Type':'application/json',...(opt.headers||{})};if(opt.auth!==false&&S.session?.access_token)h.Authorization='Bearer '+S.session.access_token;let r;try{r=await fetch(BASE+path,{method:opt.method||'GET',headers:h,body:opt.body===undefined?undefined:JSON.stringify(opt.body)})}catch(err){const e=new Error('Network error. Check your connection and try again.');e.cause=err;throw e}let t=await r.text(),d=t?(()=>{try{return JSON.parse(t)}catch{return t}})():null;if(!r.ok){let m=d?.msg||d?.message||d?.error_description||d?.error||('Request failed ('+r.status+')');const e=new Error(m);e.status=r.status;e.code=d?.code||null;throw e}return d}

async function refreshToken(){if(!S.session?.refresh_token)return false;if(refreshPromise)return refreshPromise;refreshPromise=(async()=>{try{const old=S.session;let d=await raw('/auth/v1/token?grant_type=refresh_token',{method:'POST',auth:false,body:{refresh_token:old.refresh_token}});if(!d?.access_token||!d?.refresh_token)throw Object.assign(new Error('Invalid session refresh response'),{status:401});saveSession({...old,...d});return true}catch(e){if([400,401,403].includes(Number(e?.status))){saveSession(null);S.profile=null}return false}finally{refreshPromise=null}})();return refreshPromise}

async function rawPage(path){let h={'apikey':KEY,'Content-Type':'application/json','Prefer':'count=exact'};if(S.session?.access_token)h.Authorization='Bearer '+S.session.access_token;let r;try{r=await fetch(BASE+path,{headers:h})}catch(err){const e=new Error('Network error. Check your connection and try again.');e.cause=err;throw e}let t=await r.text(),d=t?(()=>{try{return JSON.parse(t)}catch{return t}})():null;if(!r.ok){let m=d?.msg||d?.message||d?.error_description||d?.error||('Request failed ('+r.status+')');const e=new Error(m);e.status=r.status;e.code=d?.code||null;throw e}const cr=r.headers.get('content-range')||'',tail=cr.includes('/')?cr.split('/').pop():'';return {data:Array.isArray(d)?d:[],count:tail&&tail!=='*'?Number(tail):Array.isArray(d)?d.length:0}}
async function apiPage(path){if(!S.session)throw Object.assign(new Error('Session expired. Please sign in again.'),{status:401});if(sessionExpiresWithin(120)){const ok=await refreshToken();if(!ok&&!S.session)throw Object.assign(new Error('Session expired. Please sign in again.'),{status:401})}try{return await rawPage(path)}catch(e){if(isAuthError(e)){const ok=await refreshToken();if(ok)return rawPage(path);if(!S.session)throw Object.assign(new Error('Session expired. Please sign in again.'),{status:401})}throw e}}
function cleanSearch(v){return String(v||'').trim().replace(/[,*()%]/g,' ').replace(/\s+/g,' ').slice(0,120)}
function buildLeadParams({status,page=1,assignedTo=null,leadType='',state='',search='',select='*',order='created_at.desc',limit=S.pageSize}){const p=new URLSearchParams();p.set('select',select);if(status)p.set('status','eq.'+status);if(assignedTo)p.set('assigned_to','eq.'+assignedTo);if(leadType){if(leadType==='__unlabeled__')p.set('lead_type','is.null');else p.set('lead_type','eq.'+leadType)}if(state){if(state==='__nostate__')p.set('state','is.null');else p.set('state','ilike.'+state)}const z=cleanSearch(search);if(z){p.set('or','(first_name.ilike.*'+z+'*,last_name.ilike.*'+z+'*,phone.ilike.*'+z+'*,email.ilike.*'+z+'*,state.ilike.*'+z+'*,source.ilike.*'+z+'*,lead_type.ilike.*'+z+'*,agent_status.ilike.*'+z+'*,call_notes.ilike.*'+z+'*)')}p.set('order',order);p.set('limit',String(limit));p.set('offset',String(Math.max(0,(page-1)*limit)));return p.toString()}

function mfaEnrollView(){const e=S.mfaEnroll,t=e?.totp||{};app.innerHTML='<main class="auth"><section class="card stack"><div><div class="logo">Set up 2-step verification</div><div class="sub">Required for every agent account.</div></div>'+alertHtml()+'<div class="notice">Open an authenticator app such as Google Authenticator, Authy, 1Password, or Apple Passwords and scan this QR code. You only do this once.</div>'+(t.qr_code?'<div style="display:grid;place-items:center;padding:8px"><img src="'+esc(t.qr_code)+'" alt="2-step verification QR code" style="width:220px;height:220px;max-width:100%"></div>':'')+(t.secret?'<div class="field"><label>Manual setup key</label><input value="'+esc(t.secret)+'" readonly onclick="this.select()"></div>':'')+'<form id="mfaEnrollForm" class="stack"><div class="field"><label>6-digit code</label><input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="123456" required></div><button class="btn primary">Verify & continue</button></form><button id="out" class="btn secondary">Sign out</button><div class="muted small">If you lose your authenticator device, contact the agency owner to reset 2-step verification.</div></section></main>';q('#out').onclick=logout;q('#mfaEnrollForm').onsubmit=async ev=>{ev.preventDefault();const b=ev.submitter;if(b)b.disabled=true;try{await verifyMfaCode(new FormData(ev.target).get('code'),true)}catch(x){if(b)b.disabled=false;flash(x.message,true)}}}
function mfaChallengeView(){app.innerHTML='<main class="auth"><section class="card stack"><div><div class="logo">2-step verification</div><div class="sub">Enter the code from your authenticator app to continue.</div></div>'+alertHtml()+'<form id="mfaChallengeForm" class="stack"><div class="field"><label>6-digit code</label><input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="123456" required autofocus></div><button class="btn primary">Verify login</button></form><button id="out" class="btn secondary">Sign out</button></section></main>';q('#out').onclick=logout;q('#mfaChallengeForm').onsubmit=async ev=>{ev.preventDefault();const b=ev.submitter;if(b)b.disabled=true;try{await verifyMfaCode(new FormData(ev.target).get('code'),false)}catch(x){if(b)b.disabled=false;flash(x.message,true)}}}
function setupView(){app.innerHTML='<main class="auth"><section class="card stack"><div><div class="logo">Create owner account</div><div class="sub">This can only be completed once.</div></div>'+alertHtml()+'<form id="setup" class="stack"><div class="field"><label>Your name</label><input name="full_name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" minlength="10" required></div><div class="field"><label>One-time setup code</label><input name="setup_code" required></div><button class="btn primary">Create owner</button></form><button id="back" class="btn secondary">Back</button></section></main>';q('#back').onclick=()=>loginView();q('#setup').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),p=Object.fromEntries(f.entries());try{await setupOwner(p);await signIn(p.email,p.password);S.tab='dashboard';render()}catch(x){flash(x.message,true)}}}

function bindShell(){qa('[data-tab]').forEach(b=>b.onclick=async()=>{S.tab=b.dataset.tab;S.selected.clear();S.filter='';if(S.tab==='leads'){S.poolPage=1}else if(S.tab==='assigned-leads'){S.assignedPage=1}else if(S.tab==='closed'){S.closedPage=1}else if(S.tab==='my-leads'){S.myPage=1}else if(S.tab==='my-closed'){S.myClosedPage=1}try{await loadTabData();render()}catch(x){flash(x.message,true)}});q('#out').onclick=logout}
function jsonArray(v){return Array.isArray(v)?v:[]}
function csvColumns(leads){const seen=new Set(),cols=[];for(const l of leads){const hs=jsonArray(l.csv_headers),counts={};hs.forEach((raw,i)=>{const label=String(raw??'').replace(/^\ufeff/,'');counts[label]=(counts[label]||0)+1;const occ=counts[label],key=label+'\u0000'+occ;if(!seen.has(key)){seen.add(key);cols.push({rawLabel:label,label:label||('Unnamed Column '+(i+1)),occurrence:occ,key})}})}return cols}
function csvValue(l,col){const hs=jsonArray(l.csv_headers),vs=jsonArray(l.csv_values);let n=0;for(let i=0;i<hs.length;i++){if(String(hs[i]??'').replace(/^\ufeff/,'')===col.rawLabel){n++;if(n===col.occurrence)return vs[i]??''}}return ''}
function leadMatches(l,z){if(!z)return true;const vals=[l.first_name,l.last_name,l.phone,l.email,l.state,l.source,l.status,l.agent_status,l.lead_type,l.csv_filename,l.call_notes,agentName(l.assigned_to),...jsonArray(l.csv_values)];return vals.some(v=>String(v??'').toLowerCase().includes(z))}
function leadStatusLabel(v){return ({dead_number:'DEAD NUMBER',voicemail:'VOICEMAIL',follow_up_pending:'FOLLOW UP / PENDING'})[v]||'NO STATUS'}

function leadStatusBar(l){const cur=l.agent_status||'none',items=[['dead_number','DEAD NUMBER'],['voicemail','VOICEMAIL'],['follow_up_pending','FOLLOW UP / PENDING']];return '<div class="leadstatusbar">'+items.map(([v,label])=>'<button type="button" class="leadstatusbtn '+v+(cur===v?' active':'')+'" data-id="'+l.id+'" data-status="'+v+'" data-active="'+(cur===v)+'" title="'+(cur===v?'Click again to clear status':label)+'">'+label+'</button>').join('')+'</div>'}
function parseCSV(text){text=String(text||'').replace(/^\ufeff/,'');const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i];if(quoted){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else quoted=false}else cell+=ch}else{if(ch==='"'){quoted=true}else if(ch===','){row.push(cell);cell=''}else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else if(ch==='\r'){if(text[i+1]==='\n'){}else{row.push(cell);rows.push(row);row=[];cell=''}}else cell+=ch}}if(cell!==''||row.length){row.push(cell);rows.push(row)}return rows}

function normHeader(v){return String(v??'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'')}
function mappedCell(headers,values,names){const normalized=headers.map(normHeader);for(const name of names){const i=normalized.indexOf(name);if(i>=0)return values[i]??''}return ''}

function typeMatches(l,t){return !t||(t==='__unlabeled__'?!l.lead_type:l.lead_type===t)}

function poolStates(){const counts={},labels={};for(const r of S.leadFilterCounts||[]){const t=r.lead_type||'__unlabeled__';if(S.leadTypeFilter&&t!==S.leadTypeFilter)continue;const k=stateKey(r.state);counts[k]=(counts[k]||0)+Number(r.lead_count||0);if(!labels[k])labels[k]=k==='__nostate__'?'No state':String(r.state||'').trim().toUpperCase()}return Object.entries(counts).map(([k,n])=>[k,labels[k],n]).sort((a,b)=>String(a[1]).localeCompare(String(b[1])))}
function leadPage(){let rows=S.poolLeads||[],cols=csvColumns(rows),types=poolLeadTypes(),states=poolStates(),activeTotal=Number(S.stats.unassigned||0)+Number(S.stats.assigned||0);return '<div class="head"><div><h1>Lead pool</h1><p>Choose the exact lead type / batch name you created, then optionally narrow it by state before assigning.</p></div><div class="notice">'+Number(S.stats.unassigned||0).toLocaleString()+' unassigned total</div></div><div class="tools"><button id="addLead" class="btn primary">Add lead</button><button id="import" class="btn secondary">Import CSV</button><select id="leadTypeFilter" class="filterselect"><option value="">All lead types / batch names</option>'+types.map(([t,n])=>'<option value="'+esc(t)+'" '+(S.leadTypeFilter===t?'selected':'')+'>'+(t==='__unlabeled__'?'Unlabeled':esc(t))+' ('+Number(n).toLocaleString()+')</option>').join('')+'</select><select id="stateFilter" class="statefilter"><option value="">All states</option>'+states.map(([k,label,n])=>'<option value="'+esc(k)+'" '+(S.stateFilter===k?'selected':'')+'>'+esc(label)+' ('+Number(n).toLocaleString()+')</option>').join('')+'</select><button id="selectAll" class="btn secondary" '+(S.poolCount?'':'disabled')+'>Select up to 400</button><input id="selectCount" class="countpick" type="number" min="1" max="400" placeholder="1–400"><button id="selectCountBtn" class="btn secondary" '+(S.poolCount?'':'disabled')+'>Select # leads</button><button id="clearSelected" class="btn secondary" '+(S.selected.size?'':'disabled')+'>Clear selected</button><button id="deleteSelected" class="btn danger" '+(S.selected.size?'':'disabled')+'>Delete selected ('+S.selected.size+')</button><button id="deleteAll" class="btn danger" '+(activeTotal?'':'disabled')+'>Delete all active leads</button><input id="search" class="search" placeholder="Search name, phone, email, state, source, type, status, notes" value="'+esc(S.filter)+'"><select id="pick"><option value="">Choose agent…</option>'+S.agents.filter(x=>x.active).map(x=>'<option value="'+x.id+'">'+esc(x.full_name)+'</option>').join('')+'</select><button id="assign" class="btn" '+(S.selected.size?'':'disabled')+'>Assign selected ('+S.selected.size+')</button></div><div class="loadingline">Only '+S.pageSize+' rows are loaded at a time for speed. Filters and searches run in Supabase, not in your browser.</div>'+pager('pool',S.poolPage,S.poolCount)+'<div id="leadTopScroll" class="topscroll" title="Drag to scroll leads left and right"><div id="leadTopScrollInner" class="topscroll-inner"></div></div><div id="leadTableScroll" class="table csvtable"><table><thead><tr><th></th><th>Lead Type</th>'+cols.map(c=>'<th>'+esc(c.label)+'</th>').join('')+'<th>Call Notes</th><th>Lead Status</th><th>Actions</th></tr></thead><tbody>'+(rows.length?rows.map(l=>'<tr class="leadrow '+esc(l.agent_status||'none')+'"><td><input class="check leadcheck" type="checkbox" data-id="'+l.id+'" '+(S.selected.has(l.id)?'checked':'')+'></td><td><span class="badge typepill">'+esc(l.lead_type||'Unlabeled')+'</span></td>'+cols.map(c=>'<td>'+esc(csvValue(l,c)||'—')+'</td>').join('')+'<td><div class="callnotes-view">'+esc(l.call_notes||'—')+'</div></td><td>'+leadStatusBadge(l.agent_status)+'</td><td><div class="rowactions"><button class="btn danger deleteLead" data-id="'+l.id+'" data-status="'+l.status+'">Delete</button></div></td></tr>').join(''):'<tr><td colspan="'+(cols.length+6)+'" class="empty">No unassigned leads match these filters.</td></tr>')+'</tbody></table></div>'+pager('pool',S.poolPage,S.poolCount)}

function bindLeadTopScroll(){const top=q('#leadTopScroll'),table=q('#leadTableScroll'),inner=q('#leadTopScrollInner');if(!top||!table||!inner)return;const size=()=>{const t=table.querySelector('table');inner.style.width=(t?.scrollWidth||table.scrollWidth)+'px';top.style.display=(table.scrollWidth>table.clientWidth)?'block':'none'};let syncing=false;top.onscroll=()=>{if(syncing)return;syncing=true;table.scrollLeft=top.scrollLeft;requestAnimationFrame(()=>syncing=false)};table.onscroll=()=>{if(syncing)return;syncing=true;top.scrollLeft=table.scrollLeft;requestAnimationFrame(()=>syncing=false)};size();setTimeout(size,0);window.addEventListener('resize',size,{once:true})}
function bindPager(){qa('.pageBtn').forEach(b=>b.onclick=async()=>{if(b.disabled)return;const n=Math.max(1,Number(b.dataset.page||1)),k=b.dataset.kind;try{if(k==='pool'){S.poolPage=n;await loadPoolPage()}else if(k==='assigned'){S.assignedPage=n;await loadAssignedPage()}else if(k==='closed'){S.closedPage=n;await loadClosedPage()}else if(k==='my'){S.myPage=n;await loadMyLeadsPage()}else if(k==='myClosed'){S.myClosedPage=n;await loadMyClosedPage()}render();window.scrollTo({top:0,behavior:'smooth'})}catch(x){flash(x.message,true)}})}

function bindAdmin(){bindPager();if(S.tab==='leads'){bindLeadTopScroll();q('#addLead').onclick=addLeadModal;q('#import').onclick=importCsvModal;q('#leadTypeFilter').onchange=async e=>{S.leadTypeFilter=e.target.value;const valid=new Set(poolStates().map(x=>x[0]));if(S.stateFilter&&!valid.has(S.stateFilter))S.stateFilter='';S.selected.clear();S.poolPage=1;try{await loadPoolPage();render()}catch(x){flash(x.message,true)}};q('#stateFilter').onchange=async e=>{S.stateFilter=e.target.value;S.selected.clear();S.poolPage=1;try{await loadPoolPage();render()}catch(x){flash(x.message,true)}};let t=null;q('#search').oninput=e=>{S.filter=e.target.value;S.poolPage=1;clearTimeout(t);t=setTimeout(async()=>{try{await loadPoolPage();render()}catch(x){flash(x.message,true)}},300)};qa('.leadcheck').forEach(x=>x.onchange=()=>{x.checked?S.selected.add(x.dataset.id):S.selected.delete(x.dataset.id);render()});q('#selectAll').onclick=async()=>{try{S.selected=new Set(await fetchPoolIds(400));render()}catch(x){flash(x.message,true)}};q('#selectCountBtn').onclick=async()=>{let n=Math.floor(Number(q('#selectCount').value||0));if(!n||n<1)return flash('Enter how many leads you want to select.',true);n=Math.min(n,400);try{S.selected=new Set(await fetchPoolIds(n));if(!S.selected.size)return flash('No unassigned leads are available in this view.',true);render()}catch(x){flash(x.message,true)}};q('#clearSelected').onclick=()=>{S.selected.clear();render()};q('#deleteSelected').onclick=deleteSelectedLeads;q('#deleteAll').onclick=deleteAllLeadsModal;q('#assign').onclick=assignSelected;qa('.deleteLead').forEach(x=>x.onclick=()=>deleteOneLead(x.dataset.id,x.dataset.status))}if(S.tab==='assigned-leads'){bindLeadTopScroll();let t=null;q('#assignedSearch').oninput=e=>{S.filter=e.target.value;S.assignedPage=1;clearTimeout(t);t=setTimeout(async()=>{try{await loadAssignedPage();render()}catch(x){flash(x.message,true)}},300)};qa('.reclaim').forEach(x=>x.onclick=()=>reclaim(x.dataset.id));qa('.deleteLead').forEach(x=>x.onclick=()=>deleteOneLead(x.dataset.id,x.dataset.status))}if(S.tab==='agents'){q('#addAgent').onclick=addAgentModal;qa('.toggle').forEach(x=>x.onclick=()=>toggleAgent(x.dataset.id,x.dataset.active==='true'));qa('.resetMfa').forEach(x=>x.onclick=()=>resetAgentMfa(x.dataset.id,x.dataset.name));qa('.editAgent').forEach(x=>x.onclick=()=>editAgentModal(x.dataset.id,x.dataset.name,x.dataset.email));qa('.archiveAgent').forEach(x=>x.onclick=()=>archiveAgent(x.dataset.id,x.dataset.name))}}
function addLeadModal(){modal('<h2>Add lead</h2><form id="lf" class="stack"><div class="field"><label>Lead type / batch name</label><input name="lead_type" placeholder="Example: Facebook MP - September" required></div><div class="row"><div class="field"><label>First name</label><input name="first_name" required></div><div class="field"><label>Last name</label><input name="last_name" required></div></div><div class="row"><div class="field"><label>Phone</label><input name="phone"></div><div class="field"><label>Email</label><input name="email" type="email"></div></div><div class="row"><div class="field"><label>State</label><input name="state"></div><div class="field"><label>Source</label><input name="source"></div></div><div class="field"><label>Notes</label><textarea name="notes"></textarea></div><div class="row"><button type="button" id="cancel" class="btn secondary">Cancel</button><button class="btn primary right">Save lead</button></div></form>');q('#cancel').onclick=closeModal;q('#lf').onsubmit=async e=>{e.preventDefault();let p=Object.fromEntries(new FormData(e.target).entries()),headers=['First Name','Last Name','Phone','Email','State','Source','Notes'],values=[p.first_name||'',p.last_name||'',p.phone||'',p.email||'',p.state||'',p.source||'',p.notes||''];p.lead_type=String(p.lead_type||'').trim();p.csv_filename='Manual entry';p.csv_headers=headers;p.csv_values=values;['first_name','last_name','phone','email','state','source','notes'].forEach(k=>{if(!String(p[k]||'').trim())p[k]=null});try{await api('/rest/v1/leads',{method:'POST',headers:{Prefer:'return=minimal'},body:p});closeModal();S.poolPage=1;await reload('Lead added.')}catch(x){flash(x.message,true)}}}
function importCsvModal(){modal('<h2>Import CSV</h2><form id="csvForm" class="stack"><div class="notice"><strong>Nothing from your CSV will be deleted.</strong> Every column and every cell is stored and displayed in the same column order as the uploaded file.</div><div class="field"><label>Lead type / batch name</label><input name="lead_type" placeholder="Name this batch anything you want" required></div><div class="field"><label>Default source</label><input name="source" placeholder="Used only if the CSV has no Source column" value="CSV import"></div><div class="field"><label>CSV file</label><input name="file" type="file" accept=".csv,text/csv" required></div><div id="importProgress" class="muted small"></div><div class="row"><button type="button" id="cancel" class="btn secondary">Cancel</button><button id="uploadCsvBtn" class="btn primary right">Upload leads</button></div></form>');q('#cancel').onclick=closeModal;q('#csvForm').onsubmit=async e=>{e.preventDefault();const form=new FormData(e.target),file=form.get('file'),leadType=String(form.get('lead_type')||'').trim(),defaultSource=String(form.get('source')||'').trim()||'CSV import',btn=q('#uploadCsvBtn'),progress=q('#importProgress');if(!(file instanceof File)||!file.size)return flash('Choose a CSV file.',true);try{btn.disabled=true;btn.textContent='Importing…';const matrix=parseCSV(await file.text()).filter(r=>r.some(v=>String(v??'').trim()!==''));if(matrix.length<2)throw new Error('The CSV needs a header row and at least one lead row.');let headers=matrix.shift().map((h,i)=>i===0?String(h).replace(/^\ufeff/,''):String(h));const maxCols=Math.max(headers.length,...matrix.map(r=>r.length));while(headers.length<maxCols)headers.push('Unnamed Column '+(headers.length+1));const rows=matrix.map(r=>{const values=[...r];while(values.length<headers.length)values.push('');return values.slice(0,headers.length)}).filter(r=>r.some(v=>String(v??'').trim()!==''));const payload=rows.map(values=>({first_name:mappedCell(headers,values,['first_name','firstname','first','given_name'])||'',last_name:mappedCell(headers,values,['last_name','lastname','last','surname','family_name'])||'',phone:mappedCell(headers,values,['phone','phone_number','phonenumber','mobile','mobile_phone','cell','cell_phone','telephone'])||null,email:mappedCell(headers,values,['email','email_address','emailaddress'])||null,state:mappedCell(headers,values,['state','state_code','province'])||null,source:mappedCell(headers,values,['source','lead_source','leadsource'])||defaultSource,notes:mappedCell(headers,values,['notes','note','comments','comment'])||null,lead_type:leadType,csv_filename:file.name,csv_headers:headers,csv_values:values}));if(!payload.length)throw new Error('No lead rows were found.');const batch=500;for(let i=0;i<payload.length;i+=batch){if(progress)progress.textContent='Uploading '+Math.min(i+batch,payload.length).toLocaleString()+' of '+payload.length.toLocaleString()+' leads…';await api('/rest/v1/leads',{method:'POST',headers:{Prefer:'return=minimal'},body:payload.slice(i,i+batch)})}closeModal();S.poolPage=1;await reload('Imported '+payload.length.toLocaleString()+' leads with all CSV information preserved.')}catch(x){btn.disabled=false;btn.textContent='Upload leads';flash(x.message,true)}}}
function addAgentModal(){modal('<h2>Add agent</h2><form id="af" class="stack"><div class="field"><label>Full name</label><input name="full_name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Temporary password</label><input name="password" type="password" minlength="8" required></div><div class="row"><button type="button" id="cancel" class="btn secondary">Cancel</button><button class="btn primary right">Create agent</button></div></form>');q('#cancel').onclick=closeModal;q('#af').onsubmit=async e=>{e.preventDefault();let p=Object.fromEntries(new FormData(e.target).entries());try{await api('/functions/v1/create-agent',{method:'POST',body:p});closeModal();await reload('Agent created.')}catch(x){flash(x.message,true)}}}
function editAgentModal(id,name,email){modal('<h2>Edit agent</h2><form id="eaf" class="stack"><div class="field"><label>Full name</label><input name="full_name" value="'+esc(name||'')+'" required></div><div class="field"><label>Email</label><input name="email" type="email" value="'+esc(email||'')+'" required></div><div class="notice">Changing the email also changes the email this agent uses to sign in.</div><div class="row"><button type="button" id="cancel" class="btn secondary">Cancel</button><button class="btn primary right">Save changes</button></div></form>');q('#cancel').onclick=closeModal;q('#eaf').onsubmit=async e=>{e.preventDefault();let p=Object.fromEntries(new FormData(e.target).entries());p.agent_id=id;try{await api('/functions/v1/update-agent',{method:'POST',body:p});closeModal();await reload('Agent updated.')}catch(x){flash(x.message,true)}}}

async function deleteOneLead(id,status){const closed=status==='closed';const msg=closed?'Delete this closed lead? This will also permanently delete its closed-business production record.':'Permanently delete this lead? This cannot be undone.';if(!confirm(msg))return;try{let n=await api('/rest/v1/rpc/admin_delete_leads',{method:'POST',body:{p_lead_ids:[id],p_include_closed:closed}});S.selected.delete(id);await reload((Number(n)||1)+' lead deleted.')}catch(x){flash(x.message,true)}}
async function deleteSelectedLeads(){const ids=[...S.selected];if(!ids.length)return;if(!confirm('Permanently delete '+ids.length+' selected lead'+(ids.length===1?'':'s')+'? This cannot be undone.'))return;try{let n=await api('/rest/v1/rpc/admin_delete_leads',{method:'POST',body:{p_lead_ids:ids,p_include_closed:false}});S.selected.clear();await reload((Number(n)||ids.length)+' lead'+((Number(n)||ids.length)===1?'':'s')+' deleted.')}catch(x){flash(x.message,true)}}
function deleteAllLeadsModal(){const active=Number(S.stats.unassigned||0)+Number(S.stats.assigned||0);modal('<h2>Delete all active leads</h2><div class="stack"><div class="error"><strong>This is permanent.</strong> This will delete all '+active.toLocaleString()+' non-closed leads, including leads currently assigned to agents.</div><div class="card"><strong>Closed Business is protected.</strong><div class="muted small">Closed sales, production history, premiums, carrier information, and agent history will stay intact.</div></div><button id="deletePoolAll" class="btn danger">Delete all active leads</button><button id="cancel" class="btn secondary">Cancel</button></div>');q('#cancel').onclick=closeModal;q('#deletePoolAll').onclick=deleteAllPoolLeads}
async function deleteAllPoolLeads(){if(!confirm('Permanently delete EVERY active lead?\n\nThis includes unassigned leads AND leads currently assigned to agents.\n\nClosed Business will be kept.'))return;try{let n=await api('/rest/v1/rpc/admin_delete_all_leads',{method:'POST',body:{p_include_closed:false}});closeModal();S.selected.clear();S.poolPage=S.assignedPage=1;const count=Number(n)||0;await reload(count.toLocaleString()+' active lead'+(count===1?'':'s')+' deleted. Closed Business was preserved.')}catch(x){flash(x.message,true)}}
async function assignSelected(){let id=q('#pick').value;if(!id)return flash('Choose an agent first.',true);if(!S.selected.size)return flash('Select at least one lead.',true);const ids=[...S.selected];try{let assigned=0;const chunkSize=5000;for(let i=0;i<ids.length;i+=chunkSize){const chunk=ids.slice(i,i+chunkSize);const n=await api('/rest/v1/rpc/assign_leads_bulk',{method:'POST',body:{p_lead_ids:chunk,p_agent_id:id}});assigned+=Number(n||0)}S.selected.clear();await reload(assigned+' lead'+(assigned===1?'':'s')+' assigned.')}catch(x){flash(x.message||'Assignment failed. Please try again.',true)}}
async function reclaim(id){try{await api('/rest/v1/leads?id=eq.'+id+'&status=eq.assigned',{method:'PATCH',headers:{Prefer:'return=minimal'},body:{assigned_to:null,status:'unassigned',assigned_at:null}});await reload('Lead reclaimed.')}catch(x){flash(x.message,true)}}
async function toggleAgent(id,active){if(active&&!confirm('Disable this agent? Their open leads will return to your pool immediately.'))return;try{await api('/rest/v1/rpc/'+(active?'disable_agent':'enable_agent'),{method:'POST',body:{target_agent:id}});await reload(active?'Agent disabled and leads reclaimed.':'Agent enabled.')}catch(x){flash(x.message,true)}}
async function resetAgentMfa(id,name){if(!confirm('Reset 2-step verification for '+(name||'this agent')+'?\n\nThey will be signed out of active sessions and must scan a new authenticator QR code the next time they sign in.'))return;try{const r=await api('/functions/v1/reset-agent-mfa',{method:'POST',body:{agent_id:id}});await reload('2-step verification reset for '+(name||'agent')+'. Removed '+Number(r?.removed_factors||0)+' factor'+(Number(r?.removed_factors||0)===1?'':'s')+'.')}catch(x){flash(x.message,true)}}
async function archiveAgent(id,name){if(!confirm('Remove '+(name||'this agent')+'?\n\nTheir login will be disabled, any open assigned leads will return to the Lead Pool, and they will disappear from the Agents list. Closed business history will be kept.'))return;try{await api('/rest/v1/rpc/archive_agent',{method:'POST',body:{target_agent:id}});await reload((name||'Agent')+' removed. Open leads returned to the pool.')}catch(x){flash(x.message,true)}}


function agentView(){if(!['my-leads','my-closed'].includes(S.tab))S.tab='my-leads';let c=S.tab==='my-leads'?myLeads():myClosed();app.innerHTML=shell(c,'agent');bindShell();bindPager();if(S.tab==='my-leads')bindLeadTopScroll();qa('.closeLead').forEach(x=>x.onclick=()=>closeLeadModal(x.dataset.id));qa('.leadstatusbtn').forEach(x=>x.onclick=()=>setAgentLeadStatus(x.dataset.id,x.dataset.status,x.dataset.active==='true'));qa('.saveCallNotes').forEach(x=>x.onclick=()=>saveCallNotes(x.dataset.id))}
function myLeads(){let openLeads=S.leads||[],cols=csvColumns(openLeads);return '<div class="head"><div><h1>My leads</h1><p>Only open assigned leads show here. Closed leads move to Closed leads.</p></div><div class="notice">'+Number(S.myCount||0).toLocaleString()+' open leads</div></div><div class="loadingline">Only '+S.pageSize+' leads are loaded at a time for speed.</div>'+pager('my',S.myPage,S.myCount)+'<div id="leadTopScroll" class="topscroll" title="Drag to scroll your leads left and right"><div id="leadTopScrollInner" class="topscroll-inner"></div></div><div id="leadTableScroll" class="table csvtable"><table><thead><tr><th>Lead Type</th><th>Lead Status</th>'+cols.map(c=>'<th>'+esc(c.label)+'</th>').join('')+'<th>Call Notes</th><th></th></tr></thead><tbody>'+(openLeads.length?openLeads.map(l=>'<tr class="leadrow '+esc(l.agent_status||'none')+'"><td><span class="badge typepill">'+esc(l.lead_type||'Unlabeled')+'</span></td><td>'+leadStatusBar(l)+'</td>'+cols.map(c=>'<td>'+esc(csvValue(l,c)||'—')+'</td>').join('')+'<td><div class="callnotes-wrap"><textarea class="callnotes" id="callnotes-'+l.id+'" placeholder="Notes about the call…">'+esc(l.call_notes||'')+'</textarea><button class="btn secondary saveCallNotes" data-id="'+l.id+'">Save</button></div></td><td><button class="btn primary closeLead" data-id="'+l.id+'">Mark closed</button></td></tr>').join(''):'<tr><td colspan="'+(cols.length+4)+'" class="empty">No open assigned leads right now.</td></tr>')+'</tbody></table></div>'+pager('my',S.myPage,S.myCount)}
function myClosed(){let ap=Number(S.myClosedStats?.annual_premium||0);return '<div class="head"><div><h1>Closed leads</h1><p>Your submitted production history.</p></div><div class="notice">Annual premium: '+money(ap)+'</div></div>'+pager('myClosed',S.myClosedPage,S.myClosedCount)+'<div class="table"><table><thead><tr><th>Client</th><th>Lead Type</th><th>Carrier</th><th>Type</th><th>Monthly</th><th>Annual</th><th>Date</th></tr></thead><tbody>'+(S.closed.length?S.closed.map(r=>'<tr><td>'+esc((r.leads?.first_name||'')+' '+(r.leads?.last_name||''))+'</td><td>'+esc(r.leads?.lead_type||'—')+'</td><td>'+esc(r.carrier)+'</td><td>'+esc(r.policy_type)+'</td><td>'+money(r.monthly_premium)+'</td><td>'+money(r.annual_premium)+'</td><td>'+esc(r.application_date||'—')+'</td></tr>').join(''):'<tr><td colspan="7" class="empty">No closed leads yet.</td></tr>')+'</tbody></table></div>'+pager('myClosed',S.myClosedPage,S.myClosedCount)}

async function setAgentLeadStatus(id,status,isActive){const next=isActive?'none':status;try{await api('/rest/v1/rpc/set_lead_agent_status',{method:'POST',body:{p_lead_id:id,p_agent_status:next}});await reload(next==='none'?'Lead status cleared.':'Lead status set to '+leadStatusLabel(next)+'.')}catch(x){flash(x.message,true)}}
async function saveCallNotes(id){const el=q('#callnotes-'+id);if(!el)return;try{await api('/rest/v1/rpc/set_lead_call_notes',{method:'POST',body:{p_lead_id:id,p_notes:el.value}});await reload('Call notes saved.')}catch(x){flash(x.message,true)}}
function closeLeadModal(id){let l=S.leads.find(x=>x.id===id);modal('<h2>Close '+esc((l.first_name||'')+' '+(l.last_name||''))+'</h2><div class="notice">Lead type: <strong>'+esc(l.lead_type||'Unlabeled')+'</strong></div><form id="cf" class="stack"><div class="row"><div class="field"><label>Carrier</label><input name="p_carrier" required></div><div class="field"><label>Policy type</label><select name="p_policy_type" required><option value="">Select…</option><option>Final Expense</option><option>Term</option><option>IUL</option><option>Mortgage Protection</option><option>Whole Life</option><option>Other</option></select></div></div><div class="row"><div class="field"><label>Monthly premium</label><input name="p_monthly_premium" type="number" min="0" step=".01" required></div><div class="field"><label>Application date</label><input name="p_application_date" type="date" value="'+new Date().toISOString().slice(0,10)+'" required></div></div><div class="field"><label>Policy / application #</label><input name="p_policy_number"></div><div class="field"><label>Notes</label><textarea name="p_notes"></textarea></div><div class="row"><button type="button" id="cancel" class="btn secondary">Cancel</button><button class="btn primary right">Save closed lead</button></div></form>');q('#cancel').onclick=closeModal;q('#cf').onsubmit=async e=>{e.preventDefault();let p=Object.fromEntries(new FormData(e.target).entries());p.p_lead_id=id;p.p_monthly_premium=Number(p.p_monthly_premium);if(!p.p_policy_number)p.p_policy_number=null;if(!p.p_notes)p.p_notes=null;try{await api('/rest/v1/rpc/close_lead',{method:'POST',body:p});closeModal();await reload('Lead marked closed.')}catch(x){flash(x.message,true)}}}
async function reload(m){await loadCore();if(m)S.msg=m;render();if(m)setTimeout(()=>{S.msg='';render()},2500)}
setInterval(async()=>{if(S.session&&sessionExpiresWithin(300))await refreshToken()},60000);
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&S.session&&sessionExpiresWithin(300)){const ok=await refreshToken();if(ok&&S.profile){if(S.profile.role==='agent'){const ready=await ensureAgentMfa();if(ready)await loadCore()}else await loadCore()}render()}});
(async()=>{if(S.session){try{await load()}catch(e){S.err=e.message;if(!S.session){S.profile=null;render()}else{try{await loadProfile();if(S.profile?.active&&S.profile.role==='admin')await loadCore()}catch{}render()}}}else render()})();
</script></body></html>
