</style></head><body><div id="app"></div><input id="csv" class="hidden" type="file" accept=".csv,text/csv"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const BASE='https://yfuuigykpihoetgaefmu.supabase.co',KEY='sb_publishable_6O3XhhYJrjhN_5U1cFxz2g_fYI-3uE6';
function storedSession(){try{return JSON.parse(localStorage.getItem('lld_session')||'null')}catch{localStorage.removeItem('lld_session');return null}}
const S={session:storedSession(),profile:null,agents:[],leads:[],closed:[],audit:[],tab:'dashboard',selected:new Set(),msg:'',err:'',filter:'',mfaMode:null,mfaFactor:null,mfaEnroll:null};
const SB=window.supabase.createClient(BASE,KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
const app=document.getElementById('app'),q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)],esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(v||0));
function saveSession(x){S.session=x;if(x)localStorage.setItem('lld_session',JSON.stringify(x));else localStorage.removeItem('lld_session')}
function jwtPayload(){try{let part=String(S.session?.access_token||'').split('.')[1].replace(/-/g,'+').replace(/_/g,'/');part+='='.repeat((4-part.length%4)%4);return JSON.parse(atob(part))}catch{return {}}}
function currentAal(){return jwtPayload().aal||'aal1'}
async function syncSbSession(){if(!S.session?.access_token||!S.session?.refresh_token)throw new Error('Session expired. Please sign in again.');const {data,error}=await SB.auth.setSession({access_token:S.session.access_token,refresh_token:S.session.refresh_token});if(error)throw error;const ses=data?.session;if(ses?.access_token&&ses?.refresh_token)saveSession({...S.session,...ses})}
async function adoptSbSession(data){let ses=data?.session||data;if(!ses?.access_token){const r=await SB.auth.getSession();ses=r.data?.session}if(ses?.access_token&&ses?.refresh_token)saveSession({...S.session,...ses})}
async function ensureAgentMfa(){if(S.profile?.role!=='agent'){S.mfaMode=null;S.mfaFactor=null;S.mfaEnroll=null;return true}await syncSbSession();const {data,error}=await SB.auth.mfa.listFactors();if(error)throw error;const totp=data?.totp||[];const verified=totp.filter(f=>f.status==='verified');if(!verified.length){for(const f of totp.filter(f=>f.status!=='verified')){try{await SB.auth.mfa.unenroll({factorId:f.id})}catch{}}const enrolled=await SB.auth.mfa.enroll({factorType:'totp',friendlyName:'Life Lead Distribution'});if(enrolled.error)throw enrolled.error;S.mfaEnroll=enrolled.data;S.mfaFactor={id:enrolled.data.id};S.mfaMode='enroll';return false}S.mfaFactor=verified[0];S.mfaEnroll=null;if(currentAal()!=='aal2'){S.mfaMode='challenge';return false}S.mfaMode=null;return true}
async function verifyMfaCode(code,enrolling=false){code=String(code||'').replace(/\s+/g,'');if(!/^\d{6}$/.test(code))throw new Error('Enter the 6-digit verification code.');await syncSbSession();const factorId=(enrolling?S.mfaEnroll?.id:S.mfaFactor?.id);if(!factorId)throw new Error('Verification setup could not be found. Please sign in again.');const challenge=await SB.auth.mfa.challenge({factorId});if(challenge.error)throw challenge.error;const verified=await SB.auth.mfa.verify({factorId,challengeId:challenge.data.id,code});if(verified.error)throw verified.error;await adoptSbSession(verified.data);S.mfaMode=null;S.mfaEnroll=null;S.mfaFactor=null;await loadCore();render()}
function tokenExpiry(){let exp=Number(S.session?.expires_at||0);if(exp)return exp;try{let part=String(S.session?.access_token||'').split('.')[1].replace(/-/g,'+').replace(/_/g,'/');part+='='.repeat((4-part.length%4)%4);const payload=JSON.parse(atob(part));return Number(payload.exp||0)}catch{return 0}}
function sessionExpiresWithin(seconds=90){const exp=tokenExpiry();return !!exp&&exp<=Math.floor(Date.now()/1000)+seconds}
function isAuthError(e){const m=String(e?.message||'').toLowerCase();return [401,403].includes(Number(e?.status))||m.includes('jwt')||m.includes('token has expired')||m.includes('invalid token')||m.includes('not authenticated')}
async function raw(path,opt={}){let h={'apikey':KEY,'Content-Type':'application/json',...(opt.headers||{})};if(opt.auth!==false&&S.session?.access_token)h.Authorization='Bearer '+S.session.access_token;let r;try{r=await fetch(BASE+path,{method:opt.method||'GET',headers:h,body:opt.body===undefined?undefined:JSON.stringify(opt.body)})}catch(err){const e=new Error('Network error. Check your connection and try again.');e.cause=err;throw e}let t=await r.text(),d=t?(()=>{try{return JSON.parse(t)}catch{return t}})():null;if(!r.ok){let m=d?.msg||d?.message||d?.error_description||d?.error||('Request failed ('+r.status+')');const e=new Error(m);e.status=r.status;e.code=d?.code||null;throw e}return d}
let refreshPromise=null;
async function refreshToken(){if(!S.session?.refresh_token)return false;if(refreshPromise)return refreshPromise;refreshPromise=(async()=>{try{const old=S.session;let d=await raw('/auth/v1/token?grant_type=refresh_token',{method:'POST',auth:false,body:{refresh_token:old.refresh_token}});if(!d?.access_token||!d?.refresh_token)throw Object.assign(new Error('Invalid session refresh response'),{status:401});saveSession({...old,...d});return true}catch(e){if([400,401,403].includes(Number(e?.status))){saveSession(null);S.profile=null}return false}finally{refreshPromise=null}})();return refreshPromise}
async function api(path,opt={}){if(opt.auth!==false){if(!S.session)throw Object.assign(new Error('Session expired. Please sign in again.'),{status:401});if(sessionExpiresWithin(120)){const ok=await refreshToken();if(!ok&&!S.session)throw Object.assign(new Error('Session expired. Please sign in again.'),{status:401})}}try{return await raw(path,opt)}catch(e){if(opt.auth!==false&&isAuthError(e)){const ok=await refreshToken();if(ok)return raw(path,opt);if(!S.session)throw Object.assign(new Error('Session expired. Please sign in again.'),{status:401})}throw e}}
async function fetchAll(path,pageSize=1000){const all=[];for(let offset=0;;offset+=pageSize){const sep=path.includes('?')?'&':'?';const page=await api(path+sep+'limit='+pageSize+'&offset='+offset);if(!Array.isArray(page))return page;all.push(...page);if(page.length<pageSize)break}return all}
async function signIn(email,password){let d=await raw('/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:{email,password}});saveSession(d);await load();}
async function setupOwner(p){return raw('/functions/v1/setup-owner',{method:'POST',auth:false,body:p})}
async function logout(){try{await api('/auth/v1/logout',{method:'POST'})}catch{}try{await SB.auth.signOut({scope:'local'})}catch{}saveSession(null);S.profile=null;S.mfaMode=null;S.mfaFactor=null;S.mfaEnroll=null;render()}
async function loadProfile(){if(!S.session)return;let u=S.session.user?.id;if(!u){let me=await api('/auth/v1/user');u=me.id;S.session.user=me;saveSession(S.session)}let d=await api('/rest/v1/profiles?select=id,email,full_name,role,active&id=eq.'+u);S.profile=d?.[0]||null}
async function loadCore(){if(!S.profile)return;if(S.profile.role==='admin'){let [a,l,c,au]=await Promise.all([api('/rest/v1/profiles?select=id,email,full_name,active,archived,created_at&role=eq.agent&archived=is.false&order=created_at.desc'),fetchAll('/rest/v1/leads?select=*&order=created_at.desc'),fetchAll('/rest/v1/closed_business?select=*,leads(first_name,last_name,lead_type,csv_headers,csv_values),profiles(full_name)&order=created_at.desc'),api('/rest/v1/audit_logs?select=*&order=created_at.desc&limit=100')]);S.agents=a||[];S.leads=l||[];S.closed=c||[];S.audit=au||[]}else{let id=S.profile.id;let [l,c]=await Promise.all([fetchAll('/rest/v1/leads?select=*&assigned_to=eq.'+id+'&status=eq.assigned&order=assigned_at.desc'),fetchAll('/rest/v1/closed_business?select=*,leads(first_name,last_name,lead_type,csv_headers,csv_values)&agent_id=eq.'+id+'&order=created_at.desc')]);S.leads=l||[];S.closed=c||[]}}
async function load(){await loadProfile();if(S.profile?.active){if(S.profile.role==='agent'){const ready=await ensureAgentMfa();if(ready)await loadCore()}else await loadCore()}render()}

function alertHtml(){return (S.err?'<div class="error">'+esc(S.err)+'</div>':'')+(S.msg?'<div class="success">'+esc(S.msg)+'</div>':'')}
function flash(m,bad=false){S[bad?'err':'msg']=m;S[bad?'msg':'err']='';render();setTimeout(()=>{S.msg=S.err='';render()},3000)}
function render(){if(!S.session)return loginView();if(!S.profile)return loginView('Your account is missing an agency profile.');if(!S.profile.active)return disabledView();if(S.profile.role==='agent'&&S.mfaMode==='enroll')return mfaEnrollView();if(S.profile.role==='agent'&&S.mfaMode==='challenge')return mfaChallengeView();return S.profile.role==='admin'?adminView():agentView()}
function loginView(note=''){app.innerHTML='<main class="auth"><section class="card stack"><div><div class="logo">Life Lead Distribution</div><div class="sub">Private life insurance lead distribution portal.</div></div>'+alertHtml()+(note?'<div class="notice">'+esc(note)+'</div>':'')+'<form id="login" class="stack"><div class="field"><label>Email</label><input name="email" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div><button class="btn primary">Sign in</button></form><div class="muted small">Private portal. Agent accounts are created by the owner only.</div></section></main>';q('#login').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{await signIn(f.get('email').trim(),f.get('password'));}catch(x){flash(x.message,true)}}}
function mfaEnrollView(){const e=S.mfaEnroll,t=e?.totp||{};app.innerHTML='<main class="auth"><section class="card stack"><div><div class="logo">Set up 2-step verification</div><div class="sub">Required for every agent account.</div></div>'+alertHtml()+'<div class="notice">Open an authenticator app such as Google Authenticator, Authy, 1Password, or Apple Passwords and scan this QR code. You only do this once.</div>'+(t.qr_code?'<div style="display:grid;place-items:center;padding:8px"><img src="'+esc(t.qr_code)+'" alt="2-step verification QR code" style="width:220px;height:220px;max-width:100%"></div>':'')+(t.secret?'<div class="field"><label>Manual setup key</label><input value="'+esc(t.secret)+'" readonly onclick="this.select()"></div>':'')+'<form id="mfaEnrollForm" class="stack"><div class="field"><label>6-digit code</label><input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="123456" required></div><button class="btn primary">Verify & continue</button></form><button id="out" class="btn secondary">Sign out</button><div class="muted small">If you lose your authenticator device, contact the agency owner to reset 2-step verification.</div></section></main>';q('#out').onclick=logout;q('#mfaEnrollForm').onsubmit=async ev=>{ev.preventDefault();const b=ev.submitter;if(b)b.disabled=true;try{await verifyMfaCode(new FormData(ev.target).get('code'),true)}catch(x){if(b)b.disabled=false;flash(x.message,true)}}}
function mfaChallengeView(){app.innerHTML='<main class="auth"><section class="card stack"><div><div class="logo">2-step verification</div><div class="sub">Enter the code from your authenticator app to continue.</div></div>'+alertHtml()+'<form id="mfaChallengeForm" class="stack"><div class="field"><label>6-digit code</label><input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="123456" required autofocus></div><button class="btn primary">Verify login</button></form><button id="out" class="btn secondary">Sign out</button></section></main>';q('#out').onclick=logout;q('#mfaChallengeForm').onsubmit=async ev=>{ev.preventDefault();const b=ev.submitter;if(b)b.disabled=true;try{await verifyMfaCode(new FormData(ev.target).get('code'),false)}catch(x){if(b)b.disabled=false;flash(x.message,true)}}}
function setupView(){app.innerHTML='<main class="auth"><section class="card stack"><div><div class="logo">Create owner account</div><div class="sub">This can only be completed once.</div></div>'+alertHtml()+'<form id="setup" class="stack"><div class="field"><label>Your name</label><input name="full_name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" minlength="10" required></div><div class="field"><label>One-time setup code</label><input name="setup_code" required></div><button class="btn primary">Create owner</button></form><button id="back" class="btn secondary">Back</button></section></main>';q('#back').onclick=()=>loginView();q('#setup').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),p=Object.fromEntries(f.entries());try{await setupOwner(p);await signIn(p.email,p.password);S.tab='dashboard';render()}catch(x){flash(x.message,true)}}}
function disabledView(){app.innerHTML='<main class="auth"><section class="card stack"><div class="logo">Access disabled</div><div class="notice">Your account has been disabled by the agency owner. Your open leads are no longer accessible.</div><button id="out" class="btn secondary">Sign out</button></section></main>';q('#out').onclick=logout}
function shell(c,role){let nav=(role==='admin'?[['dashboard','Dashboard'],['leads','Lead Pool'],['assigned-leads','Assigned Leads'],['agents','Agents'],['closed','Closed business'],['activity','Activity']]:[['my-leads','My leads'],['my-closed','Closed leads']]).map(([k,v])=>'<button data-tab="'+k+'" class="'+(S.tab===k?'active':'')+'">'+v+'</button>').join('');return '<header class="top"><div class="topin"><div class="brand"><div class="mark">LL</div><div><div class="brandname">Life Lead Distribution</div><div class="role">'+(role==='admin'?'Owner / Admin':'Agent portal')+' · '+esc(S.profile.full_name)+'</div></div></div><nav class="nav">'+nav+'<button id="out">Sign out</button></nav></div></header><main class="wrap">'+alertHtml()+c+'</main>'}
function bindShell(){qa('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;S.selected.clear();S.filter='';render()});q('#out').onclick=logout}
function jsonArray(v){return Array.isArray(v)?v:[]}
function csvColumns(leads){const seen=new Set(),cols=[];for(const l of leads){const hs=jsonArray(l.csv_headers),counts={};hs.forEach((raw,i)=>{const label=String(raw??'').replace(/^\ufeff/,'');counts[label]=(counts[label]||0)+1;const occ=counts[label],key=label+'\u0000'+occ;if(!seen.has(key)){seen.add(key);cols.push({rawLabel:label,label:label||('Unnamed Column '+(i+1)),occurrence:occ,key})}})}return cols}
function csvValue(l,col){const hs=jsonArray(l.csv_headers),vs=jsonArray(l.csv_values);let n=0;for(let i=0;i<hs.length;i++){if(String(hs[i]??'').replace(/^\ufeff/,'')===col.rawLabel){n++;if(n===col.occurrence)return vs[i]??''}}return ''}
function leadMatches(l,z){if(!z)return true;const vals=[l.first_name,l.last_name,l.phone,l.email,l.state,l.source,l.status,l.agent_status,l.lead_type,l.csv_filename,l.call_notes,agentName(l.assigned_to),...jsonArray(l.csv_values)];return vals.some(v=>String(v??'').toLowerCase().includes(z))}

function leadStatusBadge(v){v=v||'none';return '<span class="leadstatusbadge '+esc(v)+'">'+esc(leadStatusLabel(v))+'</span>'}
function leadStatusBar(l){const cur=l.agent_status||'none',items=[['dead_number','DEAD NUMBER'],['voicemail','VOICEMAIL'],['follow_up_pending','FOLLOW UP / PENDING']];return '<div class="leadstatusbar">'+items.map(([v,label])=>'<button type="button" class="leadstatusbtn '+v+(cur===v?' active':'')+'" data-id="'+l.id+'" data-status="'+v+'" data-active="'+(cur===v)+'" title="'+(cur===v?'Click again to clear status':label)+'">'+label+'</button>').join('')+'</div>'}
function parseCSV(text){text=String(text||'').replace(/^\ufeff/,'');const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i];if(quoted){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else quoted=false}else cell+=ch}else{if(ch==='"'){quoted=true}else if(ch===','){row.push(cell);cell=''}else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else if(ch==='\r'){if(text[i+1]==='\n'){}else{row.push(cell);rows.push(row);row=[];cell=''}}else cell+=ch}}if(cell!==''||row.length){row.push(cell);rows.push(row)}return rows}

function normHeader(v){return String(v??'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'')}
function mappedCell(headers,values,names){const normalized=headers.map(normHeader);for(const name of names){const i=normalized.indexOf(name);if(i>=0)return values[i]??''}return ''}

function addLeadModal(){modal('<h2>Add lead</h2><form id="lf" class="stack"><div class="field"><label>Lead type / batch name</label><input name="lead_type" placeholder="Example: Mortgage Protection - September" required></div><div class="row"><div class="field"><label>First name</label><input name="first_name"></div><div class="field"><label>Last name</label><input name="last_name"></div></div><div class="row"><div class="field"><label>Phone</label><input name="phone"></div><div class="field"><label>Email</label><input name="email" type="email"></div></div><div class="row"><div class="field"><label>State</label><input name="state"></div><div class="field"><label>Source</label><input name="source"></div></div><div class="field"><label>Notes</label><textarea name="notes"></textarea></div><div class="row"><button type="button" id="cancel" class="btn secondary">Cancel</button><button class="btn primary right">Save lead</button></div></form>');q('#cancel').onclick=closeModal;q('#lf').onsubmit=async e=>{e.preventDefault();let p=Object.fromEntries(new FormData(e.target).entries()),headers=['First Name','Last Name','Phone','Email','State','Source','Notes'],values=[p.first_name||'',p.last_name||'',p.phone||'',p.email||'',p.state||'',p.source||'',p.notes||''];p.csv_filename='Manual entry';p.csv_headers=headers;p.csv_values=values;['first_name','last_name','phone','email','state','source','notes'].forEach(k=>{if(!String(p[k]||'').trim())p[k]=null});try{await api('/rest/v1/leads',{method:'POST',headers:{Prefer:'return=minimal'},body:p});closeModal();await reload('Lead added.')}catch(x){flash(x.message,true)}}}
function importCsvModal(){modal('<h2>Import CSV</h2><form id="csvForm" class="stack"><div class="notice"><strong>Nothing from your CSV will be deleted.</strong> Every column and every cell is stored and displayed in the same column order as the uploaded file.</div><div class="field"><label>Lead type / batch name</label><input name="lead_type" placeholder="Example: Final Expense - Facebook Leads" required></div><div class="field"><label>Default source</label><input name="source" placeholder="Used only if the CSV has no Source column" value="CSV import"></div><div class="field"><label>CSV file</label><input name="file" type="file" accept=".csv,text/csv" required></div><div class="row"><button type="button" id="cancel" class="btn secondary">Cancel</button><button class="btn primary right">Upload leads</button></div></form>');q('#cancel').onclick=closeModal;q('#csvForm').onsubmit=async e=>{e.preventDefault();const form=new FormData(e.target),file=form.get('file'),leadType=String(form.get('lead_type')||'').trim(),defaultSource=String(form.get('source')||'').trim()||'CSV import';if(!(file instanceof File)||!file.size)return flash('Choose a CSV file.',true);try{const matrix=parseCSV(await file.text()).filter(r=>r.some(v=>String(v??'').trim()!==''));if(matrix.length<2)throw new Error('The CSV needs a header row and at least one lead row.');let headers=matrix.shift().map((h,i)=>i===0?String(h).replace(/^\ufeff/,''):String(h));const maxCols=Math.max(headers.length,...matrix.map(r=>r.length));while(headers.length<maxCols)headers.push('Unnamed Column '+(headers.length+1));const rows=matrix.map(r=>{const values=[...r];while(values.length<headers.length)values.push('');return values.slice(0,headers.length)}).filter(r=>r.some(v=>String(v??'').trim()!==''));const payload=rows.map(values=>({first_name:mappedCell(headers,values,['first_name','firstname','first','given_name'])||'',last_name:mappedCell(headers,values,['last_name','lastname','last','surname','family_name'])||'',phone:mappedCell(headers,values,['phone','phone_number','phonenumber','mobile','mobile_phone','cell','cell_phone','telephone'])||null,email:mappedCell(headers,values,['email','email_address','emailaddress'])||null,state:mappedCell(headers,values,['state','state_code','province'])||null,source:mappedCell(headers,values,['source','lead_source','leadsource'])||defaultSource,notes:mappedCell(headers,values,['notes','note','comments','comment'])||null,lead_type:leadType,csv_filename:file.name,csv_headers:headers,csv_values:values}));if(!payload.length)throw new Error('No lead rows were found.');for(let i=0;i<payload.length;i+=200){await api('/rest/v1/leads',{method:'POST',headers:{Prefer:'return=minimal'},body:payload.slice(i,i+200)})}closeModal();await reload('Imported '+payload.length+' leads with all CSV information preserved.')}catch(x){flash(x.message,true)}}}

async function archiveAgent(id,name){if(!confirm('Remove '+(name||'this agent')+'?\n\nTheir login will be disabled, any open assigned leads will return to the Lead Pool, and they will disappear from the Agents list. Closed business history will be kept.'))return;try{await api('/rest/v1/rpc/archive_agent',{method:'POST',body:{target_agent:id}});await reload((name||'Agent')+' removed. Open leads returned to the pool.')}catch(x){flash(x.message,true)}}


function agentView(){if(!['my-leads','my-closed'].includes(S.tab))S.tab='my-leads';let c=S.tab==='my-leads'?myLeads():myClosed();app.innerHTML=shell(c,'agent');bindShell();if(S.tab==='my-leads')bindLeadTopScroll();qa('.closeLead').forEach(x=>x.onclick=()=>closeLeadModal(x.dataset.id));qa('.leadstatusbtn').forEach(x=>x.onclick=()=>setAgentLeadStatus(x.dataset.id,x.dataset.status,x.dataset.active==='true'));qa('.saveCallNotes').forEach(x=>x.onclick=()=>saveCallNotes(x.dataset.id))}
function myLeads(){let openLeads=S.leads.filter(l=>l.status==='assigned'),cols=csvColumns(openLeads);return '<div class="head"><div><h1>My leads</h1><p>Only open assigned leads show here. As soon as a lead is closed, it is removed from this list and moved to Closed leads.</p></div></div><div id="leadTopScroll" class="topscroll" title="Drag to scroll your leads left and right"><div id="leadTopScrollInner" class="topscroll-inner"></div></div><div id="leadTableScroll" class="table csvtable"><table><thead><tr><th>Lead Type</th><th>Lead Status</th>'+cols.map(c=>'<th>'+esc(c.label)+'</th>').join('')+'<th>Call Notes</th><th></th></tr></thead><tbody>'+(openLeads.length?openLeads.map(l=>'<tr class="leadrow '+esc(l.agent_status||'none')+'"><td><span class="badge typepill">'+esc(l.lead_type||'Unlabeled')+'</span></td><td>'+leadStatusBar(l)+'</td>'+cols.map(c=>'<td>'+esc(csvValue(l,c)||'—')+'</td>').join('')+'<td><div class="callnotes-wrap"><textarea class="callnotes" id="callnotes-'+l.id+'" placeholder="Notes about the call…">'+esc(l.call_notes||'')+'</textarea><button class="btn secondary saveCallNotes" data-id="'+l.id+'">Save</button></div></td><td><button class="btn primary closeLead" data-id="'+l.id+'">Mark closed</button></td></tr>').join(''):'<tr><td colspan="'+(cols.length+4)+'" class="empty">No open assigned leads right now.</td></tr>')+'</tbody></table></div>'}
function myClosed(){let ap=S.closed.reduce((s,x)=>s+Number(x.annual_premium||0),0);return '<div class="head"><div><h1>Closed leads</h1><p>Your submitted production history.</p></div><div class="notice">Annual premium: '+money(ap)+'</div></div><div class="table"><table><thead><tr><th>Client</th><th>Lead Type</th><th>Carrier</th><th>Type</th><th>Monthly</th><th>Annual</th><th>Date</th></tr></thead><tbody>'+(S.closed.length?S.closed.map(r=>'<tr><td>'+esc((r.leads?.first_name||'')+' '+(r.leads?.last_name||''))+'</td><td>'+esc(r.leads?.lead_type||'—')+'</td><td>'+esc(r.carrier)+'</td><td>'+esc(r.policy_type)+'</td><td>'+money(r.monthly_premium)+'</td><td>'+money(r.annual_premium)+'</td><td>'+esc(r.application_date||'—')+'</td></tr>').join(''):'<tr><td colspan="7" class="empty">No closed leads yet.</td></tr>')+'</tbody></table></div>'}

async function setAgentLeadStatus(id,status,isActive){const next=isActive?'none':status;try{await api('/rest/v1/rpc/set_lead_agent_status',{method:'POST',body:{p_lead_id:id,p_agent_status:next}});await reload(next==='none'?'Lead status cleared.':'Lead status set to '+leadStatusLabel(next)+'.')}catch(x){flash(x.message,true)}}
async function saveCallNotes(id){const el=q('#callnotes-'+id);if(!el)return;try{await api('/rest/v1/rpc/set_lead_call_notes',{method:'POST',body:{p_lead_id:id,p_notes:el.value}});await reload('Call notes saved.')}catch(x){flash(x.message,true)}}
function closeLeadModal(id){let l=S.leads.find(x=>x.id===id);modal('<h2>Close '+esc((l.first_name||'')+' '+(l.last_name||''))+'</h2><div class="notice">Lead type: <strong>'+esc(l.lead_type||'Unlabeled')+'</strong></div><form id="cf" class="stack"><div class="row"><div class="field"><label>Carrier</label><input name="p_carrier" required></div><div class="field"><label>Policy type</label><select name="p_policy_type" required><option value="">Select…</option><option>Final Expense</option><option>Term</option><option>IUL</option><option>Mortgage Protection</option><option>Whole Life</option><option>Other</option></select></div></div><div class="row"><div class="field"><label>Monthly premium</label><input name="p_monthly_premium" type="number" min="0" step=".01" required></div><div class="field"><label>Application date</label><input name="p_application_date" type="date" value="'+new Date().toISOString().slice(0,10)+'" required></div></div><div class="field"><label>Policy / application #</label><input name="p_policy_number"></div><div class="field"><label>Notes</label><textarea name="p_notes"></textarea></div><div class="row"><button type="button" id="cancel" class="btn secondary">Cancel</button><button class="btn primary right">Save closed lead</button></div></form>');q('#cancel').onclick=closeModal;q('#cf').onsubmit=async e=>{e.preventDefault();let p=Object.fromEntries(new FormData(e.target).entries());p.p_lead_id=id;p.p_monthly_premium=Number(p.p_monthly_premium);if(!p.p_policy_number)p.p_policy_number=null;if(!p.p_notes)p.p_notes=null;try{await api('/rest/v1/rpc/close_lead',{method:'POST',body:p});closeModal();await reload('Lead marked closed.')}catch(x){flash(x.message,true)}}}
async function reload(m){await loadCore();if(m)S.msg=m;render();if(m)setTimeout(()=>{S.msg='';render()},2500)}
setInterval(async()=>{if(S.session&&sessionExpiresWithin(300))await refreshToken()},60000);
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&S.session&&sessionExpiresWithin(300)){const ok=await refreshToken();if(ok&&S.profile){if(S.profile.role==='agent'){const ready=await ensureAgentMfa();if(ready)await loadCore()}else await loadCore()}render()}});
(async()=>{if(S.session){try{await load()}catch(e){S.err=e.message;if(!S.session){S.profile=null;render()}else{try{await loadProfile();if(S.profile?.active&&S.profile.role==='admin')await loadCore()}catch{}render()}}}else render()})();
</script></body></html>
