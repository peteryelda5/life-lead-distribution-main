async function refreshToken(){if(!S.session?.refresh_token)return false;if(refreshPromise)return refreshPromise;refreshPromise=(async()=>{const old=S.session;try{let d=await raw('/auth/v1/token?grant_type=refresh_token',{method:'POST',auth:false,body:{refresh_token:old.refresh_token}});if(!d?.access_token||!d?.refresh_token)throw Object.assign(new Error('Invalid session refresh response'),{status:401});if(S.session!==old)return false;saveSession({...old,...d});if(S.profile&&currentAal()!=='aal2'&&!S.mfaMode){S.mfaMode='loading';render();}return true}catch(e){if(S.session===old&&[400,401,403].includes(Number(e?.status))){saveSession(null);S.profile=null}return false}finally{refreshPromise=null}})();return refreshPromise}
async function api(path,opt={}){if(opt.auth!==false){if(!S.session)throw Object.assign(new Error('Session expired. Please sign in again.'),{status:401});if(sessionExpiresWithin(120)){const ok=await refreshToken();if(!ok&&!S.session)throw Object.assign(new Error('Session expired. Please sign in again.'),{status:401})}}try{return await raw(path,opt)}catch(e){if(opt.auth!==false&&isAuthError(e)){const ok=await refreshToken();if(ok)return raw(path,opt);if(!S.session)throw Object.assign(new Error('Session expired. Please sign in again.'),{status:401})}throw e}}
async function fetchAll(path,pageSize=1000){const all=[];for(let offset=0;;offset+=pageSize){const sep=path.includes('?')?'&':'?';const page=await api(path+sep+'limit='+pageSize+'&offset='+offset);if(!Array.isArray(page))return page;all.push(...page);if(page.length<pageSize)break}return all}
async function rawPage(path){const epoch=portalSessionEpoch;let h={'apikey':KEY,'Content-Type':'application/json','Prefer':'count=exact'};if(S.session?.access_token)h.Authorization='Bearer '+S.session.access_token;let r;try{r=await portalFetch(BASE+path,{headers:h})}catch(err){const e=new Error('Network error. Check your connection and try again.');e.cause=err;throw e}let t=await r.text(),d=t?(()=>{try{return JSON.parse(t)}catch{return t}})():null;if(epoch!==portalSessionEpoch)throw Object.assign(new Error('Account changed. Please try again.'),{status:409});if(!r.ok){let m=d?.msg||d?.message||d?.error_description||d?.error||('Request failed ('+r.status+')');const e=new Error(m);e.status=r.status;e.code=d?.code||null;e.division=d?.division||null;throw e}const cr=r.headers.get('content-range')||'',tail=cr.includes('/')?cr.split('/').pop():'';return {data:Array.isArray(d)?d:[],count:tail&&tail!=='*'?Number(tail):Array.isArray(d)?d.length:0}}
async function apiPage(path){if(!S.session)throw Object.assign(new Error('Session expired. Please sign in again.'),{status:401});if(sessionExpiresWithin(120)){const ok=await refreshToken();if(!ok&&!S.session)throw Object.assign(new Error('Session expired. Please sign in again.'),{status:401})}try{return await rawPage(path)}catch(e){if(isAuthError(e)){const ok=await refreshToken();if(ok)return rawPage(path);if(!S.session)throw Object.assign(new Error('Session expired. Please sign in again.'),{status:401})}throw e}}
function cleanSearch(v){return String(v||'').trim().replace(/[,*()%]/g,' ').replace(/\s+/g,' ').slice(0,120)}
function buildLeadParams({status,page=1,assignedTo=null,leadType='',state='',division='',search='',select='*',order='created_at.desc',limit=S.pageSize}){const p=new URLSearchParams();p.set('select',select);if(status)p.set('status','eq.'+status);if(assignedTo)p.set('assigned_to','eq.'+assignedTo);if(division)p.set('division','eq.'+division);if(leadType){if(leadType==='__unlabeled__')p.set('lead_type','is.null');else p.set('lead_type','eq.'+leadType)}if(state){if(state==='__nostate__')p.set('state','is.null');else p.set('state','ilike.'+state)}const z=cleanSearch(search);if(z){p.set('or','(first_name.ilike.*'+z+'*,last_name.ilike.*'+z+'*,phone.ilike.*'+z+'*,email.ilike.*'+z+'*,state.ilike.*'+z+'*,source.ilike.*'+z+'*,lead_type.ilike.*'+z+'*,agent_status.ilike.*'+z+'*,call_notes.ilike.*'+z+'*)')}p.set('order',order);p.set('limit',String(limit));p.set('offset',String(Math.max(0,(page-1)*limit)));return p.toString()}
function pageCount(count){return Math.max(1,Math.ceil(Number(count||0)/S.pageSize))}
function pager(kind,page,count){const pages=pageCount(count),from=count?((page-1)*S.pageSize+1):0,to=Math.min(page*S.pageSize,count);return '<div class="pager"><div class="muted small">Showing '+from+'–'+to+' of '+Number(count||0).toLocaleString()+'</div><div class="pages"><button class="btn secondary pageBtn" data-kind="'+kind+'" data-page="'+Math.max(1,page-1)+'" '+(page<=1?'disabled':'')+'>Previous</button><span class="muted small">Page '+page+' of '+pages+'</span><button class="btn secondary pageBtn" data-kind="'+kind+'" data-page="'+Math.min(pages,page+1)+'" '+(page>=pages?'disabled':'')+'>Next</button></div></div>'}

res. Explain relevant costs and consequences before a client cancels, replaces, or surrenders existing coverage. Do not pressure a client to act.</li><li><strong>Training and reporting.</strong> Follow applicable anti-money-laundering, record retention, and carrier training requirements. Report application errors, complaints, suspected fraud, and security incidents promptly to your agency leadership. Preserve accurate records.</li></ol><p>These standards apply to agents and administrators within their duties. This letter does not replace applicable laws, state-specific requirements, carrier instructions, or required training. When unsure, pause the activity and ask your agency leadership for guidance.</p>';
async function loadOnboarding(){

  }

function editBatchHeadings(){
 let progress=readHeadingSave();const batches=[];for(const lead of S.poolLeads||[]){if(!jsonArray(lead.csv_headers).length)continue;const key=JSON.stringify([lead.csv_filename,lead.lead_type,lead.uploaded_by,lead.csv_headers]);if(!batches.some(b=>b.key===key))batches.push({key,lead})}
 if(progress)batches.unshift({key:'resume',lead:progress.lead});
 if(!batches.length)return flash('No imported batch on this page. Select a lead type first.',true);
 closeHeadingPanel();
 document.body.insertAdjacentHTML('beforeend','<section id="headingPanel" class="heading-panel" role="dialog" aria-modal="false" aria-labelledby="headingPanelTitle"><header class="heading-panel-head"><div><h2 id="headingPanelTitle">Edit column headings</h2><span>Imported batch</span></div><button type="button" id="headingClose" aria-label="Close column editor">×</button></header><form id="headingForm"><div class="heading-panel-body"><p>Rename headings for this batch. Master changes also apply to its assigned leads across agencies. Lead values, statuses, and colors stay unchanged.</p><div class="field"><label for="headingBatch">Imported batch</label><select id="headingBatch">'+batches.map((b,i)=>'<option value="'+i+'">'+esc(b.lead.lead_type||'Unlabeled')+' · '+esc(b.lead.csv_filename||'Imported leads')+'</option>').join('')+'</select></div><div id="headingFields" class="stack"></div><div id="headingError" class="error" role="alert"></div></div><footer class="heading-panel-footer"><button type="button" id="headingCancel" class="btn secondary">Cancel</button><button type="submit" class="btn primary">Save headings</button></footer></form></section>');
 const panel=q('#headingPanel');let saving=false;
 const dismiss=()=>{if(!saving)closeHeadingPanel()};const escape=e=>{if(e.key==='Escape'&&panel.contains(document.activeElement)){e.preventDefault();dismiss()}};
 document.addEventListener('keydown',escape);panel._cleanup=()=>document.removeEventListener('keydown',escape);
 const draw=()=>{const headers=progress?progress.headers:jsonArray(batches[Number(q('#headingBatch').value)].lead.csv_headers);q('#headingFields').innerHTML=headers.map((h,i)=>'<div class="field"><label for="headingInput-'+i+'">Column '+(i+1)+'</label><input id="headingInput-'+i+'" class="headingInput" required maxlength="120" value="'+esc(h)+'" '+(progress?'disabled':'')+'></div>').join('');q('#headingBatch').disabled=!!progress;if(progress){q('#headingError').className='notice';q('#headingError').textContent='An unfinished save is ready to resume. Click Save headings to finish the same headings before starting another change.'}};
 draw();q('#headingBatch').onchange=draw;q('#headingCancel').onclick=dismiss;q('#headingClose').onclick=dismiss;
 q('#headingForm').onsubmit=async e=>{
  e.preventDefault();if(saving)return;if(!progress){const values=[...panel.querySelectorAll('.headingInput')].map(i=>i.value.trim());if(values.some(v=>!v||v.length>120)||new Set(values.map(v=>v.toLowerCase())).size!==values.length){q('#headingError').className='error';q('#headingError').textContent='Use a different name for each column, with 1 to 120 characters.';return}}saving=true;const button=e.submitter||panel.querySelector('button[type="submit"]');
  if(!progress){const lead=batches[Number(q('#headingBatch').value)].lead;progress={lead:{id:lead.id,csv_headers:lead.csv_headers,csv_filename:lead.csv_filename,lead_type:lead.lead_type,uploaded_by:lead.uploaded_by},headers:[...panel.querySelectorAll('.headingInput')].map(i=>i.value.trim()),cursor:null,updated:0};writeHeadingSave(progress)}
  panel.querySelectorAll('button,input,select').forEach(x=>x.disabled=true);button.textContent='Saving…';
  try{const errorBox=q('#headingError');errorBox.className='notice';errorBox.setAttribute('role','status');errorBox.textContent='Saving headings in small batches…';
   while(true){let result;for(let attempt=0;;attempt++){try{result=await api('/rest/v1/rpc/rename_lead_batch_headers_chunk',{method:'POST',body:{p_sample_id:progress.lead.id,p_expected_headers:progress.lead.csv_headers,p_headers:progress.headers,p_after:progress.cursor}});break}catch(error){if(attempt>=2||!/statement timeout|lock timeout|deadlock|could not obtain lock/i.test(error.message||''))throw error;errorBox.textContent='A batch was busy. Retrying from the last saved position…';await new Promise(resolve=>setTimeout(resolve,400*(attempt+1)))}}
    progress.updated+=Number(result.updated||0);errorBox.textContent='Updated '+progress.updated.toLocaleString()+' leads… Keep this editor open until saving finishes.';
    if(result.done)break;if(!result.nextCursor||result.nextCursor===progress.cursor)throw Error('Saving paused. Retry to finish the remaining leads.');

   }
   const updated=progress.updated;writeHeadingSave(null);progress=null;closeHeadingPanel();await loadPoolPage();flash('Headings updated for '+updated.toLocaleString()+' leads.');
  }catch(error){if(panel.isConnected){q('#headingError').className='error';q('#headingError').setAttribute('role','alert');q('#headingError').textContent=error.message+' Your progress is saved. Click Save headings to resume.';}}
  finally{saving=false;if(panel.isConnected){panel.querySelectorAll('button').forEach(x=>x.disabled=false);panel.querySelectorAll('input,select').forEach(x=>x.disabled=!!progress);button.textContent='Save headings'}}
 };
 q('#headingBatch').focus({preventScroll:true});
}

function bindLeadColumnLayout(onSize){
 if(S.tab!=='my-leads')return;
 const table=q('#leadTableScroll table');if(!table)return;
 const headers=[...table.querySelectorAll('thead th')],counts={};
 const columns=headers.map((th,i)=>{const label=th.textContent.trim()||'Actions';counts[label]=(counts[label]||0)+1;return {key:th.dataset.columnKey||label+'::'+counts[label],legacyKey:label+'::'+counts[label],label,index:i}});
 const originals=[...table.rows].map(row=>({row,cells:[...row.cells]}));
 const apply=order=>{const sorted=[...columns].sort((a,b)=>{const ai=order.indexOf(a.key),bi=order.indexOf(b.key);return (ai<0?order.length+a.index:ai)-(bi<0?order.length+b.index:bi)});for(const {row,cells} of originals){if(cells.length!==columns.length)continue;for(const col of sorted)row.appendChild(cells[col.index])}onSize();return sorted};
 const saved=readLeadLayout(),migrated=saved.map(key=>columns.find(c=>c.key===key||c.legacyKey===key)?.key||key);let current=apply(migrated);
 let dragged=null;
 headers.forEach((th,i)=>{th.draggable=true;th.style.cursor='grab';th.title='Drag to move this column';th.ondragstart=e=>{dragged=columns[i].key;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragged);th.style.opacity='.5'};th.ondragend=()=>{dragged=null;th.style.opacity=''};th.ondragover=e=>{if(dragged){e.preventDefault();e.dataTransfer.dropEffect='move'}};th.ondrop=e=>{e.preventDefault();const target=columns[i].key;if(!dragged||target===dragged)return;const order=current.map(c=>c.key),from=order.indexOf(dragged),to=order.indexOf(target);order.splice(from,1);order.splice(to,0,dragged);try{const visible=new Set(order),retained=readLeadLayout().filter(k=>!visible.has(k));localStorage.setItem(leadLayoutKey(),JSON.stringify([...order,...retained]));current=apply(order)}catch{alert('Could not save your layout. Please allow browser storage.')}};
 });
 const tools=q('.tools');if(!tools)return;
 const controls=document.createElement('div');controls.className='row lead-layout-controls';controls.innerHTML='<button type="button" class="btn secondary" id="resetLeadLayout">Reset Layout</button>';tools.appendChild(controls);
 const reset=()=>{try{localStorage.removeItem(leadLayoutKey())}catch{}current=apply([])};
 q('#resetLeadLayout').onclick=reset;

}

 const top=q('#leadTopScroll'),table=q('#leadTableScroll'),inner=q('#leadTopScrollInner');if(!top||!table||!inner)return;

 const write=(el,value)=>{if(Math.abs(el.scrollLeft-value)<0.5)return;el.scrollLeft=value;echo.set(el,el.scrollLeft)};
 const flushSync=()=>{syncFrame=0;if(disposed||!pendingSource)return;const from=pendingSource;pendingSource=null;if(from===top&&top.style.display==='none')return;write(from===top?table:top,from.scrollLeft)};
 const sync=el=>{if(disposed)return;const expected=echo.get(el);if(expected!==undefined&&Math.abs(el.scrollLeft-expected)<0.5){echo.delete(el);return}echo.delete(el);if(owner&&owner!==el){write(el,owner.scrollLeft);return}pendingSource=el;if(!syncFrame)syncFrame=requestAnimationFrame(flushSync)};
 const size=()=>{if(disposed)return;
  const range=Math.max(0,table.scrollWidth-table.clientWidth),visible=range>0,wasVisible=top.style.display!=='none';
  // Vertical position is handled entirely by CSS sticky; never rewrite it on page scroll.
  style(top,'top',(Math.ceil(nav?.getBoundingClientRect().height||0)+8)+'px');

async function readLeadCsv(file){
 const bytes=new Uint8Array(await file.arrayBuffer());
 if(bytes[0]===0x50&&bytes[1]===0x4b)throw new Error('This is an Excel workbook. In Excel, save it as CSV UTF-8 (Comma delimited), then upload that CSV.');
 let encoding='utf-8';
 if(bytes[0]===0xff&&bytes[1]===0xfe)encoding='utf-16le';
 else if(bytes[0]===0xfe&&bytes[1]===0xff)encoding='utf-16be';
 else {let even=0,odd=0;const n=Math.min(bytes.length,4096);for(let i=0;i<n;i++)if(bytes[i]===0){if(i%2)odd++;else even++}if(n>20&&(odd>n/5||even>n/5))throw new Error('This file appears to use an unmarked UTF-16 encoding. Save it as CSV UTF-8 (Comma delimited) in Excel, then upload it.');}
 let text;try{text=new TextDecoder(encoding,{fatal:true}).decode(bytes)}catch{throw new Error('The file contains an unreadable text encoding. Save it as CSV UTF-8 (Comma delimited) in Excel, then upload it.');}
 let removed=0;text=text.replace(/\u0000/g,()=>{removed++;return ''});
 const firstLine=text.split(/\r?\n/,1)[0];
 if(firstLine.includes('\t')&&!firstLine.includes(','))throw new Error('This file is tab-separated. Save it as CSV UTF-8 (Comma delimited) in Excel, then upload it.');
 return {text,removed};
}
function importCsvModal(){const div=operatingDivision();if(!canAddLeads(div))return flash('You can add leads only to your permitted agency. Master uploads are limited to Vivid Life or Master.',true);modal('<h2>Import CSV</h2><div class="notice">This CSV will import into <strong>'+esc(divisionLabel(div))+'</strong>.</div><form id="csvForm" class="stack"><div class="notice">Every column is kept in its original order. Hidden null characters that the database cannot store are removed; the import reports how many.</div><div class="field"><label>Lead type / batch name</label><input name="lead_type" placeholder="Name this batch anything you want" required></div><div class="field"><label>Default source</label><input name="source" placeholder="Used only if the CSV has no Source column" value="CSV import"></div><div class="field"><label>CSV file</label><input name="file" type="file" accept=".csv,text/csv" required></div><div id="importProgress" class="muted small"></div><div class="row"><button type="button" id="cancel" class="btn secondary">Cancel</button><button id="uploadCsvBtn" class="btn primary right">Upload leads</button></div></form>');q('#cancel').onclick=closeModal;q('#csvForm').onsubmit=async e=>{e.preventDefault();const form=new FormData(e.target),file=form.get('file'),leadType=String(form.get('lead_type')||'').trim(),defaultSource=String(form.get('source')||'').trim()||'CSV import',btn=q('#uploadCsvBtn'),progress=q('#importProgress');if(!(file instanceof File)||!file.size)return flash('Choose a CSV file.',true);let uploaded=0,totalRows=0,removedNulls=0;try{btn.disabled=true;btn.textContent='Importing…';const decoded=await readLeadCsv(file);removedNulls=decoded.removed;const matrix=parseCSV(decoded.text).filter(r=>r.some(v=>String(v??'').trim()!==''));if(!matrix.length)throw new Error('The CSV is empty.');const firstRowLooksLikeHeader=looksLikeHeader(matrix[0]);let headers;if(firstRowLooksLikeHeader){headers=matrix.shift().map((h,i)=>i===0?String(h).replace(/^\ufe function applyLeadStatusInPlace(id,next){
 const statuses=['dead_number','appointment_follow_up','not_interested','call_back'];
 const lead=S.leads.find(x=>x.id===id);if(lead)lead.agent_status=next;
 const row=qa('.lead-status-edit').find(b=>b.dataset.id===id)?.closest('tr.leadrow');
 if(!row)return;
 row.classList.remove(...statuses,'none');row.classList.add(next||'none');
 const badge=row.querySelector('.leadstatusbadge');
 if(badge){
   badge.classList.remove(...statuses,'none');badge.classList.add(next||'none');
   badge.innerHTML='<span class="lead-status-dot" aria-hidden="true"></span>'+esc(leadStatusLabel(next));
 }
 const edit=row.querySelector('.lead-status-edit');
 if(edit)edit.setAttribute('aria-label','Change lead status: '+leadStatusLabel(next));
 document.getElementById('lead-status-'+id)?.querySelectorAll('.lead-status-choice').forEach(b=>{
   const active=b.dataset.status===next;
   b.setAttribute('aria-pressed',String(active));
   const tick=b.querySelector('.lead-status-tick');if(tick)tick.textContent=active?'✓':'';
 });

}
async function setAgentLeadStatus(id,status,isActive){
 const next=isActive?'none':status;
 try{
   await api('/rest/v1/rpc/set_lead_agent_status',{method:'POST',body:{p_lead_id:id,p_agent_status:next}});
   applyLeadStatusInPlace(id,next);
   S.msg=next==='none'?'Lead status cleared.':'Lead status set to '+leadStatusLabel(next)+'.';
   S.err='';
   setTimeout(()=>{S.msg=''},1800);
 }catch(x){throw x}
}
async function saveCallNotes(id){const el=q('#callnotes-'+id);if(!el)return;const button=qa('.saveCallNotes').find(b=>b.dataset.id===id);if(button?.disabled)return;const value=el.value,userId=S.profile?.id;if(button){button.disabled=true;button.textContent='Saving…'}el.parentElement.querySelector('.callnotes-result')?.remove();try{await api('/rest/v1/rpc/set_lead_call_notes',{method:'POST',body:{p_lead_id:id,p_notes:value}});if(S.profile?.id!==userId)return;const lead=S.leads.find(x=>x.id===id);if(lead)lead.call_notes=value;if(el.isConnected)el.insertAdjacentHTML('afterend','<span class="callnotes-result muted small" role="status">Notes saved.</span>')}catch(error){if(el.isConnected)el.insertAdjacentHTML('afterend','<span class="callnotes-result error" role="alert">'+esc(error.message||'Could not save notes. Try again.')+'</span>')}finally{if(button?.isConnected){button.disabled=false;button.textContent='Save'}}}
function closeLeadModal(id){let l=S.leads.find(x=>x.id===id);modal('<h2>Close '+esc((l.first_name||'')+' '+(l.last_name||''))+'</h2><div class="notice">Lead type: <strong>'+esc(l.lead_type||'Unlabeled')+'</strong></div><form id="cf" class="stack"><div class="row"><div class="field"><label>Carrier</label>'+portalCarrierSelectHtml('closedDealCarrier')+'</div><div class="field"><label>Policy type</label><select name="p_policy_type" required><option value="">Select…</option><option>Final Expense</option><option>Term</option><option>IUL</option><option>Mortgage Protection</option><option>Whole Life</option><option>Other</option></select></div></div><div class="row"><div class="field"><label>Monthly premium</label><input name="p_monthly_premium" type="number" min="0" step=".01" required></div><div class="field"><label>Application date</label><input name="p_application_date" type="date" value="'+new Date().toISOString().slice(0,10)+'" required></div></div><div class="field"><label>Policy / application #</label><input name="p_policy_number"></div><div class="field"><label>Notes</label><textarea name="p_notes"></textarea></div><div class="row"><button type="button" id="cancel" class="btn secondary">Cancel</button><button class="btn primary right">Save closed lead</button></div></form>');portalFillDealCarriers(q('#closedDealCarrier'));q('#cancel').onclick=closeModal;q('#cf').onsubmit=async e=>{e.preventDefault();let p=Object.fromEntries(new FormData(e.target).entries());p.p_lead_id=id;p.p_monthly_premium=Number(p.p_monthly_premium);if(!p.p_policy_number)p.p_policy_number=null;if(!p.p_notes)p.p_notes=null;try{await api('/rest/v1/rpc/close_lead',{method:'POST',body:p});closeModal();await reload('Lead marked closed.')}catch(x){flash(x.message,true)}}}

function closedClientName(l){if(!l)return 'Deal without linked lead';const name=[l.first_name,l.last_name].filter(Boolean).join(' ').trim();if(name)return name;const hs=jsonArray(l.csv_headers),vs=jsonArray(l.csv_values);const i=hs.findIndex(h=>/^(full[ _-]?name|client[ _-]?name|name|insured[ _-]?name)$/i.test(String(h).trim()));return i>=0&&vs[i]?String(vs[i]):'View full lead'}

async function openClosedDeal(id){modal('<h2>Closed deal</h2><p>Loading full lead…</p><button class="btn secondary" id="closeDealDetails">Close</button>');q('#closeDealDetails').onclick=closeModal;const box=q('#modal .modalbox');box.style.width='min(1000px, 94vw)';box.style.maxWidth='1000px';box.style.maxHeight='90vh';box.style.overflowY='auto';try{const rows=await api('/rest/v1/closed_business?select=*,leads(*)&id=eq.'+encodeURIComponent(id)+'&limit=1');if(!box.isConnected)return;const deal=rows?.[0];if(!deal)throw new Error('This closed deal is no longer available to your account.');const l=deal.leads;const field=(label,value)=>'<div class="field"><label>'+esc(label)+'</label><div style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(value==null||value===''?'—':String(value))+'</div></div>';let leadHtml=deal.lead_id?'<p>The original lead is unavailable.</p>':'<p>This deal was recorded without linking a lead.</p>';if(l){const hs=jsonArray(l.csv_headers),vs=jsonArray(l.csv_values);leadHtml='<div class="row">'+field('First name',l.first_name)+field('Last name',l.last_name)+field('Phone',l.phone)+field('Email',l.email)+field('State',l.state)+field('Lead type / batch',l.lead_type)+field('Source',l.source)+'</div>'+field('Lead notes',l.notes)+field('Call notes',l.call_notes)+'<h3>All uploaded fields</h3><div class="stack">'+Array.from({length:Math.max(hs.length,vs.length)},(_,i)=>field(hs[i]||('Column '+(i+1)),vs[i])).join('')+'</div>';}box.innerHTML='<h2>'+esc(closedClientName(l))+'</h2><h3>Closed deal</h3><div class="row">'+field('Carrier',deal.carrier)+field('Policy type',deal.policy_type)+field('Policy number',deal.policy_number)+field('Monthly premium',money(deal.monthly_premium))+field('Annual premium',money(deal.annual_premium))+field('Application date',deal.application_date)+'</div>'+field('Deal notes',deal.notes)+'<h3>Full lead</h3>'+leadHtml+((S.profile.role==='admin'||deal.agent_id===S.profile.id)&&l?'<div class="row section"><button class="btn primary" id="editClosedLead">Edit lead information</button></div><div id="closedCorrectionHistory" class="section">Loading correction history…</div>':'')+'<div id="dealRemoveError" role="alert"></div>'+((S.profile.role==='admin'||deal.agent_id===S.profile.id)?'<button class="btn primary" id="editClosedDeal">Edit deal details</button> ':'')+(S.profile.role==='admin'?'<button class="btn danger" data-remove-deal="'+esc(deal.id)+'">Remove deal / subtract production</button> ':'')+'<button class="btn secondary" id="closeDealDetails">Close</button>';q('#closeDealDetails').onclick=closeModal;bindDealRemoval();bindClosedLeadCorrection(deal);bindClosedDealEdit(deal);}catch(e){if(box.isConnected){box.innerHTML='<h2>Closed deal</h2><p>'+esc(e.message)+'</p><button class="btn secondary" id="closeDealDetails">Close</button>';q('#closeDealDetails').onclick=closeModal;}}}
