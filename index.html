function parseCSV(text){text=String(text||'').replace(/^\ufeff/,'');const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i];if(quoted){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else quoted=false}else cell+=ch}else{if(ch==='"'){quoted=true}else if(ch===','){row.push(cell);cell=''}else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else if(ch==='\r'){if(text[i+1]==='\n'){}else{row.push(cell);rows.push(row);row=[];cell=''}}else cell+=ch}}if(cell!==''||row.length){row.push(cell);rows.push(row)}return rows}

async function readLeadCsv(file){
 const bytes=new Uint8Array(await file.arrayBuffer());
 if(bytes[0]===0x50&&bytes[1]===0x4b)throw new Error('This is an Excel workbook. In Excel, save it as CSV UTF-8 (Comma delimited), then upload that CSV.');
 let encoding='utf-8';
 if(bytes[0]===0xff&&bytes[1]===0xfe)encoding='utf-16le';
 else if(bytes[0]===0xfe&&bytes[1]===0xff)encoding='utf-16be';
 else {let even=0,odd=0;const n=Math.min(bytes.length,4096);for(let i=0;i<n;i++)if(bytes[i]===0){if(i%2)odd++;else even++}if(n>20&&(odd>n/5||even>n/5))throw new Error('This file appears to use an unmarked UTF-16 encoding. Save it as CSV UTF-8 (Comma delimited) in Excel, then upload it.');}
 let text;try{text=new TextDecoder(encoding,{fatal:true}).decode(bytes)}catch{throw new Error('The file contains an unreadable text encoding. Save it as CSV UTF-8 (Comma delimited) in Excel, then upload it.');}
 let removed=0;text=text.replace(/\u0000/g,()=>{removed++;return ''});
 const firstLine=text.split(/\r?\n/,1)[0];
 if(firstLine.includes('\t')&&!firstLine.includes(','))throw new Error('This file is tab-separated. Save it as CSV UTF-8 (Comma delimited) in Excel, then upload it.');
 return {text,removed};

function applyLeadStatusInPlace(id,next){
 const statuses=['dead_number','appointment_follow_up','not_interested','call_back'];
 const lead=S.leads.find(x=>x.id===id);if(lead)lead.agent_status=next;
 const row=qa('.lead-status-edit').find(b=>b.dataset.id===id)?.closest('tr.leadrow');
 if(!row)return;
 row.classList.remove(...statuses,'none');row.classList.add(next||'none');
 const badge=row.querySelector('.leadstatusbadge');
 if(badge){
   badge.classList.remove(...statuses,'none');badge.classList.add(next||'none');
   badge.innerHTML='<span class="lead-status-dot" aria-hidden="true"></span>'+esc(leadStatusLabel(next));
 }
 const edit=row.querySelector('.lead-status-edit');
 if(edit)edit.setAttribute('aria-label','Change lead status: '+leadStatusLabel(next));
 row.querySelectorAll('.lead-status-choice').forEach(b=>{
   const active=b.dataset.status===next;
   b.setAttribute('aria-pressed',String(active));
   const tick=b.querySelector('.lead-status-tick');if(tick)tick.textContent=active?'✓':'';
 });
 if(next==='dead_number'){
   row.parentElement?.appendChild(row);
   if(lead){
     const i=S.leads.findIndex(x=>x.id===id);
     if(i>=0){const [moved]=S.leads.splice(i,1);S.leads.push(moved)}
   }
 }
}
async function setAgentLeadStatus(id,status,isActive){
 const next=isActive?'none':status;
 try{
   await api('/rest/v1/rpc/set_lead_agent_status',{method:'POST',body:{p_lead_id:id,p_agent_status:next}});
   applyLeadStatusInPlace(id,next);
   S.msg=next==='none'?'Lead status cleared.':'Lead status set to '+leadStatusLabel(next)+'.';
   S.err='';
   setTimeout(()=>{S.msg=''},1800);
 }catch(x){flash(x.message,true)}
}
async function saveCallNotes(id){const el=q('#callnotes-'+id);if(!el)return;try{await api('/rest/v1/rpc/set_lead_call_notes',{method:'POST',body:{p_lead_id:id,p_notes:el.value}});await reload('Call notes saved.')}catch(x){flash(x.message,true)}}
function closeLeadModal(id){let l=S.leads.find(x=>x.id===id);modal('<h2>Close '+esc((l.first_name||'')+' '+(l.last_name||''))+'</h2><div class="notice">Lead type: <strong>'+esc(l.lead_type||'Unlabeled')+'</strong></div><form id="cf" class="stack"><div class="row"><div class="field"><label>Carrier</label><input name="p_carrier" required></div><div class="field"><label>Policy type</label><select name="p_policy_type" required><option value="">Select…</option><option>Final Expense</option><option>Term</option><option>IUL</option><option>Mortgage Protection</option><option>Whole Life</option><option>Other</option></select></div></div><div class="row"><div class="field"><label>Monthly premium</label><input name="p_monthly_premium" type="number" min="0" step=".01" required></div><div class="field"><label>Application date</label><input name="p_application_date" type="date" value="'+new Date().toISOString().slice(0,10)+'" required></div></div><div class="field"><label>Policy / application #</label><input name="p_policy_number"></div><div class="field"><label>Notes</label><textarea name="p_notes"></textarea></div><div class="row"><button type="button" id="cancel" class="btn secondary">Cancel</button><button class="btn primary right">Save closed lead</button></div></form>');q('#cancel').onclick=closeModal;q('#cf').onsubmit=async e=>{e.preventDefault();let p=Object.fromEntries(new FormData(e.target).entries());p.p_lead_id=id;p.p_monthly_premium=Number(p.p_monthly_premium);if(!p.p_policy_number)p.p_policy_number=null;if(!p.p_notes)p.p_notes=null;try{await api('/rest/v1/rpc/close_lead',{method:'POST',body:p});closeModal();await reload('Lead marked closed.')}catch(x){flash(x.message,true)}}}
async function reload(m){await loadCore();if(m)S.msg=m;render();if(m)setTimeout(()=>{S.msg='';render()},2500)}
setInterval(async()=>{if(S.session&&sessionExpiresWithin(300))await refreshToken()},60000);
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&S.session&&sessionExpiresWithin(300)){const ok=await refreshToken();if(ok&&S.profile){if(S.profile.role==='agent'){const ready=await ensureAgentMfa();if(ready)await loadCore()}else await loadCore()}render()}});
(async()=>{if(S.session){try{await load()}catch(e){S.err=e.message;if(!S.session){S.profile=null;render()}else{try{await loadProfile();if(S.profile?.active&&S.profile.role==='admin')await loadCore()}catch{}render()}}}else render()})();
</script></body></html>
